name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Glasmio source
        uses: actions/checkout@v4
        with:
          repository: NEORUAA/Glasmio
          ref: aad1605a2807cddaf5afacea131d528bc9452c9f
          path: .glasmio-ci
          persist-credentials: false

      - name: Place Glasmio beside the app checkout
        run: mv "$GITHUB_WORKSPACE/.glasmio-ci" "$GITHUB_WORKSPACE/../Glasmio"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
          arguments: >-
            testDebugUnitTest assembleDebug
            -Pglasmio.source=true
            -Pmei.buildCommitSha=${{ github.sha }}
            -Pmei.ciRunNumber=${{ github.run_number }}
            -Pmei.ciRunAttempt=${{ github.run_attempt }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeiloO-${{ github.run_number }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
